[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "psf-zero"
version = "1.0.0"
description = "A Qiskit transpiler pass that replaces heuristic 2-qubit unitary synthesis with an exact, closed-form Cartan (KAK) decomposition."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "The Architect", email = "contact.love.os.architect@proton.me"}
]
keywords = ["qiskit", "quantum-control", "manifold-optimization", "error-mitigation", "unitary-synthesis"]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "qiskit==2.5.2"
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "matplotlib"]

[project.urls]
"Homepage" = "https://github.com/TN-Holdings-LLC/psf-zero"
"Bug Tracker" = "https://github.com/TN-Holdings-LLC/psf-zero/issues"

[tool.setuptools]
py-modules = ["psf_compile"]
packages = []
